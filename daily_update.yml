name: 每日自動更新 0050 轉折點與總經儀表板

on:
  schedule:
    # 台灣時間週一至週五 16:00 (UTC 08:00) 自動執行
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 檢出倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化轉折點與總經數據更新
        run: |
          python update_dashboard.py

      - name: 上傳 GitHub Pages 構建產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
